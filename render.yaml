databases:
  - name: davomat-db
    databaseName: davomat
    user: davomat_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: 8-a-soatlik-davomat
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: davomat-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "true"
